<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BA Characters Internal ID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .controls {
            padding: 20px 30px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-group label {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }

        .filter-group select {
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #4f46e5;
        }

        /* 列显示控制按钮 */
        .column-toggle-btn {
            padding: 10px 14px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .column-toggle-btn:hover {
            border-color: #4f46e5;
            background: #f1f5f9;
        }

        /* 列选择下拉菜单 */
        .column-dropdown {
            position: relative;
            display: inline-block;
        }

        .column-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 5px;
            background: white;
            min-width: 180px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-radius: 8px;
            z-index: 100;
            padding: 10px 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .column-dropdown-content.show {
            display: block;
        }

        .column-dropdown-item {
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #334155;
        }

        .column-dropdown-item:hover {
            background: #f1f5f9;
        }

        .column-dropdown-item input[type="checkbox"] {
            cursor: pointer;
        }

        .table-container {
            overflow-x: auto;
            max-height: 70vh;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* 表头样式 - 支持排序 */
        th {
            background: #f1f5f9;
            padding: 0;
            text-align: left;
            font-weight: 600;
            color: #475569;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
            vertical-align: top;
        }

        /* 表头内容容器 */
        .th-content {
            padding: 10px 12px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            height: 40px;
        }

        .th-content:hover {
            background: #e2e8f0;
        }

        /* 排序箭头 */
        .sort-arrow {
            font-size: 10px;
            color: #94a3b8;
            transition: color 0.2s;
        }

        .th-content.sort-asc .sort-arrow,
        .th-content.sort-desc .sort-arrow {
            color: #4f46e5;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }

        tr:hover {
            background: #f8fafc;
        }

        .school-tag {
            display: inline-block;
            padding: 3px 8px;
            background: #fef3c7;
            color: #92400e;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #64748b;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 60px;
            color: #dc2626;
        }

        .empty {
            text-align: center;
            padding: 60px;
            color: #64748b;
        }

        .footer {
            padding: 20px 30px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }

        .footer a {
            color: #4f46e5;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* 文件ID列限制宽度 */
        td[data-col="file_id"],
        th[data-col="file_id"] {
            max-width: 120px;
            width: 120px;
        }

        /* KivoWiki 和 Spine ID 列限制宽度 */
        td[data-col="char_id"],
        th[data-col="char_id"],
        td[data-col="spine_id"],
        th[data-col="spine_id"] {
            max-width: 80px;
            width: 80px;
            text-align: center;
        }

        /* 隐藏列的样式 */
        .col-hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .stats {
                gap: 20px;
            }

            .stat-value {
                font-size: 1.5rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: 100%;
            }

            .filter-group {
                justify-content: space-between;
            }

            th, td {
                padding: 10px 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 蔚蓝档案角色内部ID数据</h1>
            <p>Blue Archive Characters Internal ID Database</p>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">-</div>
                    <div class="stat-label">总记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="charCount">-</div>
                    <div class="stat-label">角色数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="updateTime">-</div>
                    <div class="stat-label">数据更新时间</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索角色名称...">
            </div>
            <div class="filter-group">
                <label>学校:</label>
                <select id="schoolFilter">
                    <option value="">全部</option>
                </select>
            </div>
            <!-- 列显示控制 -->
            <div class="column-dropdown">
                <button class="column-toggle-btn" onclick="toggleColumnDropdown()">显示/隐藏列 ▼</button>
                <div class="column-dropdown-content" id="columnDropdown">
                    <!-- 动态生成列选项 -->
                </div>
            </div>
        </div>

        <div class="table-container" id="tableContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>正在加载数据...</p>
            </div>
        </div>

        <div class="footer">
            <p><a href="https://github.com/Agent-0808/BA-characters-internal-id" target="_blank">GitHub 仓库</a> | 
            <a id="dataFileLink" href="https://github.com/Agent-0808/BA-characters-internal-id/Releases" target="_blank">数据文件</a> | 
            <a href="https://kivo.wiki" target="_blank">基沃托斯古书馆</a></p>
        </div>
    </div>

    <script>
        // 配置 - 自动判断本地还是线上环境
        const CONFIG = {
            csvUrl: (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')
                ? 'output/students_data.csv'
                : 'https://raw.githubusercontent.com/Agent-0808/BA-characters-internal-id/data/output/students_data.csv',
            repoOwner: 'Agent-0808',
            repoName: 'BA-characters-internal-id'
        };

        // 列配置 - 定义所有列的信息
        const COLUMN_CONFIG = [
            { key: 'file_id', label: '文件ID', defaultVisible: true },
            { key: 'char_id', label: 'KivoWiki', defaultVisible: true },
            { key: 'spine_id', label: 'Spine ID', defaultVisible: true },
            { key: 'full_name', label: '完整名称', defaultVisible: true },
            { key: 'name', label: '角色名', defaultVisible: false },
            { key: 'skin_name', label: '皮肤名', defaultVisible: false },
            { key: 'name_cn', label: '国服名称', defaultVisible: false },
            { key: 'name_jp', label: '日本語', defaultVisible: true },
            { key: 'name_tw', label: '繁體中文', defaultVisible: false },
            { key: 'name_en', label: 'English', defaultVisible: true },
            { key: 'name_kr', label: '한국어', defaultVisible: false },
            { key: 'school_name', label: '学校', defaultVisible: true }
        ];

        let allData = [];
        let filteredData = [];
        let currentSort = { column: null, direction: 'asc' };
        let columnVisibility = {};

        // 初始化列显示状态
        function initColumnVisibility() {
            COLUMN_CONFIG.forEach(col => {
                columnVisibility[col.key] = col.defaultVisible;
            });
        }

        // 解析 CSV
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            const result = [];

            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                const row = {};
                headers.forEach((header, index) => {
                    row[header] = values[index]?.trim() || '';
                });
                result.push(row);
            }

            return result;
        }

        // 解析单行 CSV
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                const nextChar = line[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }

            result.push(current);
            return result;
        }

        // 生成表头 HTML
        function generateHeaderHTML() {
            return COLUMN_CONFIG.map((col, index) => {
                if (!columnVisibility[col.key]) return '';
                const sortClass = currentSort.column === col.key ? `sort-${currentSort.direction}` : '';
                const arrow = currentSort.column === col.key
                    ? (currentSort.direction === 'asc' ? '▲' : '▼')
                    : '⇅';
                return `
                    <th data-col="${col.key}">
                        <div class="th-content ${sortClass}" onclick="sortBy('${col.key}')">
                            ${col.label}
                            <span class="sort-arrow">${arrow}</span>
                        </div>
                    </th>
                `;
            }).join('');
        }

        // 生成数据行 HTML
        function generateRowHTML(row) {
            return COLUMN_CONFIG.map(col => {
                if (!columnVisibility[col.key]) return '';
                let value = row[col.key] || '';

                // 特殊处理某些列
                if (col.key === 'file_id') {
                    return `<td data-col="${col.key}"><code>${value}</code></td>`;
                } else if (col.key === 'name') {
                    return `<td data-col="${col.key}"><strong>${value}</strong></td>`;
                } else if (col.key === 'skin_name') {
                    return `<td data-col="${col.key}">${value || '-'}</td>`;
                } else if (col.key === 'school_name') {
                    return `<td data-col="${col.key}"><span class="school-tag">${value}</span></td>`;
                } else {
                    return `<td data-col="${col.key}">${value}</td>`;
                }
            }).join('');
        }

        // 渲染表格
        function renderTable(data) {
            const container = document.getElementById('tableContainer');

            if (data.length === 0) {
                container.innerHTML = '<div class="empty"><p>没有找到匹配的数据</p></div>';
                return;
            }

            const html = `
                <table>
                    <thead>
                        <tr>
                            ${generateHeaderHTML()}
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(row => `
                            <tr>${generateRowHTML(row)}</tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // 排序功能
        function sortBy(column) {
            if (currentSort.column === column) {
                // 切换排序方向
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }

            // 排序数据
            filteredData.sort((a, b) => {
                let valA = a[column] || '';
                let valB = b[column] || '';

                // 尝试数字排序
                const numA = parseFloat(valA);
                const numB = parseFloat(valB);
                
                if (!isNaN(numA) && !isNaN(numB) && valA !== '' && valB !== '') {
                    return currentSort.direction === 'asc' ? numA - numB : numB - numA;
                }

                // 字符串排序
                valA = valA.toString().toLowerCase();
                valB = valB.toString().toLowerCase();
                
                if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });

            renderTable(filteredData);
        }

        // 应用所有筛选条件
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const schoolFilter = document.getElementById('schoolFilter').value;

            filteredData = allData.filter(row => {
                // 全局搜索
                const matchSearch = !searchTerm ||
                    row.name?.toLowerCase().includes(searchTerm) ||
                    row.full_name?.toLowerCase().includes(searchTerm) ||
                    row.name_cn?.toLowerCase().includes(searchTerm) ||
                    row.name_jp?.toLowerCase().includes(searchTerm) ||
                    row.name_tw?.toLowerCase().includes(searchTerm) ||
                    row.name_en?.toLowerCase().includes(searchTerm) ||
                    row.name_kr?.toLowerCase().includes(searchTerm) ||
                    row.file_id?.toLowerCase().includes(searchTerm);

                // 学校筛选
                const matchSchool = !schoolFilter || row.school_name === schoolFilter;

                return matchSearch && matchSchool;
            });

            // 如果有排序，重新应用
            if (currentSort.column) {
                sortBy(currentSort.column);
            } else {
                renderTable(filteredData);
            }
            updateStats(filteredData);
        }

        // 生成列控制下拉菜单
        function generateColumnDropdown() {
            const dropdown = document.getElementById('columnDropdown');
            dropdown.innerHTML = COLUMN_CONFIG.map(col => `
                <label class="column-dropdown-item">
                    <input type="checkbox" 
                           ${columnVisibility[col.key] ? 'checked' : ''} 
                           onchange="toggleColumn('${col.key}', this.checked)">
                    ${col.label}
                </label>
            `).join('');
        }

        // 切换列显示/隐藏
        function toggleColumn(column, visible) {
            columnVisibility[column] = visible;
            renderTable(filteredData);
        }

        // 显示/隐藏下拉菜单
        function toggleColumnDropdown() {
            const dropdown = document.getElementById('columnDropdown');
            dropdown.classList.toggle('show');
        }

        // 点击外部关闭下拉菜单
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('columnDropdown');
            const btn = document.querySelector('.column-toggle-btn');
            if (!dropdown.contains(event.target) && !btn.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });

        // 更新统计
        function updateStats(data) {
            document.getElementById('totalCount').textContent = data.length;
            const uniqueChars = new Set(data.map(d => d.char_id)).size;
            document.getElementById('charCount').textContent = uniqueChars;
        }

        // 填充学校筛选器
        function populateSchoolFilter(data) {
            const schools = [...new Set(data.map(d => d.school_name).filter(Boolean))].sort();
            const select = document.getElementById('schoolFilter');

            schools.forEach(school => {
                const option = document.createElement('option');
                option.value = school;
                option.textContent = school;
                select.appendChild(option);
            });
        }

        // 获取最新的 Release 信息
        async function fetchLatestRelease() {
            try {
                const apiUrl = `https://api.github.com/repos/${CONFIG.repoOwner}/${CONFIG.repoName}/releases/latest`;
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`GitHub API error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('获取 Release 信息失败:', error);
                return null;
            }
        }

        // 更新页面底部的 Release 链接
        function updateReleaseLink(release) {
            const dataFileLink = document.getElementById('dataFileLink');
            if (dataFileLink && release) {
                dataFileLink.href = release.html_url;
                dataFileLink.textContent = '下载数据';
            }
        }

        // 加载数据
        async function loadData() {
            try {
                initColumnVisibility();
                generateColumnDropdown();

                const [csvResponse, release] = await Promise.all([
                    fetch(CONFIG.csvUrl),
                    fetchLatestRelease()
                ]);

                if (!csvResponse.ok) {
                    throw new Error(`HTTP error! status: ${csvResponse.status}`);
                }

                const text = await csvResponse.text();
                allData = parseCSV(text);
                filteredData = allData;

                updateStats(allData);
                populateSchoolFilter(allData);
                renderTable(allData);

                if (release && release.published_at) {
                    const releaseDate = new Date(release.published_at);
                    document.getElementById('updateTime').textContent = releaseDate.toLocaleDateString('zh-CN');
                    updateReleaseLink(release);
                } else {
                    document.getElementById('updateTime').textContent = new Date().toLocaleDateString('zh-CN');
                }
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('tableContainer').innerHTML = `
                    <div class="error">
                        <p>❌ 加载数据失败</p>
                        <p style="font-size: 12px; margin-top: 10px;">${error.message}</p>
                        <p style="font-size: 12px; margin-top: 10px;">
                            请确保数据文件已上传到 data 分支的 output 目录
                        </p>
                    </div>
                `;
            }
        }

        // 事件监听
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('schoolFilter').addEventListener('change', applyFilters);

        // 初始化
        loadData();
    </script>
</body>
</html>
