<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KivoWiki 导航</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 KivoWiki 角色数据导航</h1>
            <p>KivoWiki Characters Navigation</p>
            <div class="nav-links">
                <a href="index.html">📊 文件ID</a>
                <a href="kivonavi.html" class="active">🎴 KivoWiki导航</a>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">-</div>
                    <div class="stat-label">学生数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="pageCount">-</div>
                    <div class="stat-label">页面数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="updateTime">-</div>
                    <div class="stat-label">数据更新时间</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索学生名称...">
            </div>
            <div class="filter-group">
                <label>学校:</label>
                <select id="schoolFilter">
                    <option value="">全部</option>
                </select>
            </div>
            <div class="filter-group">
                <label>实装:</label>
                <select id="installFilter">
                    <option value="">全部</option>
                    <option value="jp">日服</option>
                    <option value="cn">国服</option>
                    <option value="global">国际服</option>
                    <option value="npc">NPC</option>
                </select>
            </div>
            <div class="controls-extra">
                <button class="btn btn-secondary" id="expandAllBtn">展开全部</button>
                <button class="btn btn-secondary" id="collapseAllBtn">折叠全部</button>
            </div>
        </div>

        <div class="students-container" id="studentsContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>正在加载数据...</p>
            </div>
        </div>

        <div class="footer">
            <p>
                <a href="https://github.com/Agent-0808/BA-characters-internal-id" target="_blank">GitHub 仓库</a> | 
                <a href="./data/" target="_blank">数据文件</a> | 
                <a href="https://kivo.wiki" target="_blank">基沃托斯古书馆</a>
            </p>
        </div>
    </div>

    <script type="module" src="/src/students.ts"></script>
</body>
</html>
