<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BA Characters Internal ID</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 蔚蓝档案角色内部ID速查表</h1>
            <p>Blue Archive Characters Internal ID Database</p>
            <div class="nav-links" id="navLinks">
                <a href="index.html" class="active">📊 文件ID</a>
                <a href="kivonavi.html">🎴 KivoWiki导航</a>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">-</div>
                    <div class="stat-label">总记录</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="studentCount">-</div>
                    <div class="stat-label">学生数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="updateTime">-</div>
                    <div class="stat-label">数据更新时间</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索角色名称...">
            </div>
            <!-- 学校多选筛选 -->
            <div class="school-filter-dropdown">
                <button class="school-filter-btn" id="schoolFilterBtn">
                    <span class="school-filter-label">学校</span>
                    <span class="school-filter-count" id="schoolFilterCount"></span>
                    <span class="school-filter-arrow">▼</span>
                </button>
                <div class="school-filter-content" id="schoolDropdown">
                    <!-- 动态生成学校选项 -->
                </div>
            </div>
            <!-- 列显示控制 -->
            <div class="column-dropdown">
                <button class="column-toggle-btn">显示/隐藏列 ▼</button>
                <div class="column-dropdown-content" id="columnDropdown">
                    <!-- 动态生成列选项 -->
                </div>
            </div>
        </div>

        <div class="table-container" id="tableContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>正在加载数据...</p>
            </div>
        </div>

        <div class="footer">
            <p>
                <a href="https://github.com/Agent-0808/BA-characters-internal-id" target="_blank">GitHub 仓库</a> | 
                <a id="dataFileLink" href="./data/" target="_blank">数据文件</a> | 
                <a href="https://kivo.wiki" target="_blank">基沃托斯古书馆</a>
            </p>
        </div>
    </div>

    <script>
      document.querySelectorAll('#navLinks a').forEach(a => {
        a.href += window.location.search;
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
