<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BA Characters Internal ID</title>
</head>
<body>
    <!-- 全局设置按钮（固定右上角，两个视图共用） -->
    <button class="settings-btn" id="settingsBtn" title="设置" aria-label="设置">⚙️</button>

    <div class="container">
        <!-- 视图一：文件ID速查表 -->
        <section class="view" id="view-index">
            <div class="header">
                <div class="header-left">
                    <h1>📚 蔚蓝档案角色内部ID速查表</h1>
                    <p>Blue Archive Characters Internal ID Database</p>
                </div>
                <div class="header-right">
                    <div class="stats">
                        <span class="stat-item"><span class="stat-value" id="totalCount">-</span><span class="stat-label">总记录</span></span>
                        <span class="stat-item"><span class="stat-value" id="studentCount">-</span><span class="stat-label">学生数</span></span>
                        <span class="stat-item"><span class="stat-value" id="updateTime">-</span><span class="stat-label">数据更新时间</span></span>
                    </div>
                    <div class="nav-links">
                        <a href="#index" class="active">📊 文件ID</a>
                        <a href="#kivonavi">🎴 KivoWiki导航</a>
                    </div>
                </div>
            </div>

            <div class="controls">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索角色名称...">
                </div>
                <!-- 学校多选筛选 -->
                <div class="school-filter-dropdown">
                    <button class="school-filter-btn" id="schoolFilterBtn">
                        <span class="school-filter-label">学校</span>
                        <span class="school-filter-count" id="schoolFilterCount"></span>
                        <span class="school-filter-arrow">▼</span>
                    </button>
                    <div class="school-filter-content" id="schoolDropdown">
                        <!-- 动态生成学校选项 -->
                    </div>
                </div>
                <!-- 列显示控制 -->
                <div class="column-dropdown">
                    <button class="column-toggle-btn">显示/隐藏列 ▼</button>
                    <div class="column-dropdown-content" id="columnDropdown">
                        <!-- 动态生成列选项 -->
                    </div>
                </div>
            </div>

            <div class="table-container" id="tableContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载数据...</p>
                </div>
            </div>
        </section>

        <!-- 视图二：KivoWiki 导航 -->
        <section class="view" id="view-kivonavi" hidden>
            <div class="header">
                <div class="header-left">
                    <h1>📚 KivoWiki 角色数据导航</h1>
                    <p>KivoWiki Characters Navigation</p>
                </div>
                <div class="header-right">
                    <div class="stats">
                        <span class="stat-item"><span class="stat-value" id="kivoTotalCount">-</span><span class="stat-label">学生数</span></span>
                        <span class="stat-item"><span class="stat-value" id="kivoPageCount">-</span><span class="stat-label">页面数</span></span>
                        <span class="stat-item"><span class="stat-value" id="kivoUpdateTime">-</span><span class="stat-label">数据更新时间</span></span>
                    </div>
                    <div class="nav-links">
                        <a href="#index">📊 文件ID</a>
                        <a href="#kivonavi" class="active">🎴 KivoWiki导航</a>
                    </div>
                </div>
            </div>

            <div class="controls">
                <div class="search-box">
                    <input type="text" id="kivoSearchInput" placeholder="搜索学生名称...">
                </div>
                <!-- 学校多选筛选（与文件ID页共用样式和逻辑） -->
                <div class="school-filter-dropdown">
                    <button class="school-filter-btn" id="kivoSchoolFilterBtn">
                        <span class="school-filter-label">学校</span>
                        <span class="school-filter-count" id="kivoSchoolFilterCount"></span>
                        <span class="school-filter-arrow">▼</span>
                    </button>
                    <div class="school-filter-content" id="kivoSchoolDropdown">
                        <!-- 动态生成学校选项 -->
                    </div>
                </div>
                <div class="filter-group">
                    <label>实装:</label>
                    <select id="installFilter">
                        <option value="">全部</option>
                        <option value="jp">日服</option>
                        <option value="cn">国服</option>
                        <option value="global">国际服</option>
                        <option value="npc">NPC</option>
                    </select>
                </div>
                <div class="controls-extra">
                    <button class="btn btn-secondary" id="expandAllBtn">展开全部</button>
                    <button class="btn btn-secondary" id="collapseAllBtn">折叠全部</button>
                </div>
            </div>

            <div class="students-container" id="studentsContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载数据...</p>
                </div>
            </div>
        </section>

        <div class="footer">
            <p>
                <a href="https://github.com/Agent-0808/BA-characters-internal-id" target="_blank">GitHub 仓库</a> |
                <a id="dataFileLink" href="./data/" target="_blank">数据文件</a> |
                <a href="https://kivo.wiki" target="_blank">基沃托斯古书馆</a>
            </p>
            <!-- 右侧显示 web / 数据 提交 hash（来自 metadata.json，截取前6位） -->
            <p class="footer-hashes" id="footerHashes" title="web / 数据 提交 hash"></p>
        </div>
    </div>

    <!-- 设置面板（Click FX 配置，默认隐藏） -->
    <div class="settings-panel" id="settingsPanel" hidden>
        <div class="settings-header">
            <span data-i18n="settings.title">设置</span>
            <button class="settings-close" id="settingsClose" aria-label="关闭" data-i18n-attrs="aria-label:common.close">✕</button>
        </div>
        <div class="settings-body">
            <div class="settings-group">
                <div class="settings-group-title" data-i18n="settings.groupUi">界面</div>
                <label class="settings-item">
                    <span data-i18n="settings.language">语言</span>
                    <select id="uiLang" class="settings-select"></select>
                </label>
                <label class="settings-item" data-i18n-attrs="title:settings.spineLinkHint" title="勾选后表格中的 spine_id 与导航页的 Spine 编号将显示为可点击链接">
                    <input type="checkbox" id="uiSpineLink">
                    <span data-i18n="settings.spineLink">Spine ID 显示为链接</span>
                </label>
            </div>
            <div class="settings-group">
                <div class="settings-group-title">点击特效</div>
                <label class="settings-item">
                    <input type="checkbox" id="fxEnabled">
                    启用点击特效
                </label>
                <label class="settings-item">
                    <input type="checkbox" id="fxClickEnabled">
                    点击特效
                </label>
                <label class="settings-item">
                    <input type="checkbox" id="fxTrailEnabled">
                    拖尾特效
                </label>
                <label class="settings-item">
                    <input type="checkbox" id="fxTrailAlways">
                    移动鼠标时也显示拖尾
                </label>
                <label class="settings-item settings-range">
                    <span>不透明度</span>
                    <input type="range" id="fxOpacity" min="0" max="1" step="0.05">
                    <span class="range-value" id="fxOpacityValue">1.00</span>
                </label>
                <label class="settings-item settings-range">
                    <span>缩放</span>
                    <input type="range" id="fxScale" min="0.1" max="3" step="0.05">
                    <span class="range-value" id="fxScaleValue">1.00</span>
                </label>
                <label class="settings-item settings-color">
                    <span>主题色</span>
                    <input type="color" id="fxThemeColor" value="#4ca7ff">
                </label>
            </div>
            <button class="btn btn-secondary settings-reset" id="settingsReset">恢复默认</button>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
