name: 日常检测更新

# 触发机制配置
on:
  # 定时任务：每天北京时间 3点 (UTC时间 19点)
  schedule:
    - cron: '0 19 * * *'
  
  # 允许在网页端手动点击按钮触发
  workflow_dispatch:
    inputs:
      skip_cache:
        description: '不使用缓存'
        required: false
        default: false
        type: boolean
      always_push:
        description: '总是推送（即使CSV未改变也推送）'
        required: false
        default: false
        type: boolean
  
  # 当代码推送到 workflow-test 分支时触发测试（调试用）
  push:
    branches:
      - workflow-test

# 权限配置：允许 Action 读写仓库内容以进行推送和发布 Release，以及触发其他工作流
permissions:
  contents: write
  actions: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 检出当前分支（main）的代码
      - name: 检出代码仓库
        uses: actions/checkout@v4

      # 读取版本号文件并设置为环境变量
      - name: 读取版本号
        working-directory: ./crawler
        run: echo "CODE_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      # 配置 Python 环境
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 安装依赖库
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      # 尝试从 data 分支拉取上次的缓存文件
      # 从远程的 data 分支恢复到当前工作目录，实现增量更新
      - name: 从 data 分支恢复数据
        if: github.event.inputs.skip_cache != 'true'
        run: |
          echo "正在检查远程 data 分支..."
          
          # 判断 fetch 是否成功，如果分支不存在会进入 else
          if git fetch origin data >/dev/null 2>&1; then
            echo "发现缓存，正在恢复..."
            # 把 origin/data 分支下的所有文件检出到当前目录
            git checkout origin/data -- .
          else
            echo "远程 data 分支不存在。"
            echo "未发现缓存，将建立新缓存目录。"
            mkdir -p cache
          fi

      # 备份旧数据用于对比
      # 在运行爬虫前备份旧的output目录，用于生成变更报告
      - name: 备份旧数据用于对比
        run: |
          # 即使跳过缓存，也要从 data 分支获取旧数据用于对比
          if [ ! -d "output" ] && [ "${{ github.event.inputs.skip_cache }}" == "true" ]; then
            echo "跳过缓存模式：从 data 分支获取旧数据用于对比..."
            if git fetch origin data >/dev/null 2>&1; then
              git checkout origin/data -- output/ 2>/dev/null || true
            fi
          fi

          if [ -d "output" ]; then
            echo "备份旧数据到 prev_output..."
            cp -r output prev_output
          else
            echo "无旧数据，跳过备份"
          fi

      # 记录运行前的状态文件指纹
      # 通过计算 students.json 的 MD5 哈希值来判断数据是否进行了更新
      - name: 记录运行前状态
        id: pre_state
        run: |
          if [ -f "output/students.json" ]; then
            md5sum output/students.json | awk '{print $1}' > pre_hash.txt
          else
            echo "empty" > pre_hash.txt
          fi
          echo "运行前 Hash: $(cat pre_hash.txt)"

      # 获取当前日期
      - name: 获取当前日期
        id: date
        run: |
          echo "当前日期: $(date +'%Y-%m-%d')"
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # 运行主程序
      - name: 运行爬虫脚本
        run: python -m crawler -m 1 -d 3

      # 检测数据是否发生变化
      # 对比运行前后的 students.json 哈希值
      - name: 检测是否有数据更新
        id: check_changes
        run: |
          # 计算运行后的哈希
          if [ -f "output/students.json" ]; then
            md5sum output/students.json | awk '{print $1}' > post_hash.txt
          else
            echo "empty" > post_hash.txt
          fi

          echo "运行前 Hash: $(cat pre_hash.txt)"
          echo "运行后 Hash: $(cat post_hash.txt)"

          # 比较两个哈希文件，-s 表示静默模式
          if cmp -s pre_hash.txt post_hash.txt; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "💤 数据文件未发生变化，无需更新。"
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到新数据！准备提交和发布。"
          fi

      # 准备要发布到 data 分支的文件
      # 仅当检测到变化或总是推送时运行
      - name: 准备发布文件
        if: steps.check_changes.outputs.changes_detected == 'true' || github.event.inputs.always_push == 'true'
        run: |
          mkdir -p deployment_folder

          if [ -d "output" ]; then
            cp -r output deployment_folder/
            # 删除 diff_report.md，不提交到 data 分支
            rm -f deployment_folder/output/diff_report.md || true
          fi

          if [ -d "cache" ]; then
            cp -r cache deployment_folder/
          fi

          echo "以下文件将被推送到 data 分支："
          ls -R deployment_folder

      # 将数据和缓存推送到 data 分支
      # 仅当检测到变化或总是推送时运行
      - name: 将数据和缓存推送到 data 分支
        if: steps.check_changes.outputs.changes_detected == 'true' || github.event.inputs.always_push == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deployment_folder
          publish_branch: data
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "Auto-update: ${{ env.CODE_VERSION }}-${{ steps.date.outputs.date }}"
          keep_files: false
          enable_jekyll: true

      # 生成变更报告（仅用于 Release）
      # 在创建 Release 前临时生成，用后自动清理
      - name: 生成变更报告
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: python -m crawler.diff_report

      # 创建 Release 发布
      # 仅当检测到变化时运行
      - name: 创建 Release 版本
        if: steps.check_changes.outputs.changes_detected == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.date.outputs.date }}-${{ env.CODE_VERSION }}
          name: ${{ steps.date.outputs.date }}
          target_commitish: data
          body_path: output/diff_report.md
          files: |
            output/students_data.csv
            output/skipped_ids.csv
            output/students.json
            output/spines.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 触发 Pages 部署工作流
      # 仅当检测到变化时运行
      - name: 触发 Pages 部署
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          gh workflow run pages.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 触发 Gist 发布工作流
      # 仅当检测到变化时运行
      - name: 触发 Gist 发布
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          gh workflow run gist.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
