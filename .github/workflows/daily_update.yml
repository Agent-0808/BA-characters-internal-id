name: 日常检测更新

# 触发机制配置
on:
  # 定时任务：每天北京时间 3点 (UTC时间 19点)
  schedule:
    - cron: '0 19 * * *'
  
  # 允许在网页端手动点击按钮触发
  workflow_dispatch:
    inputs:
      skip_cache:
        description: '不使用缓存'
        required: false
        default: false
        type: boolean
      force_deploy:
        description: '强制重新部署（不推送数据，仅触发部署与发布）'
        required: false
        default: false
        type: boolean
      force_data_push:
        description: '强制推送 data 分支并发布 Release（用于词表等不影响 students.json 哈希的变更）'
        required: false
        default: false
        type: boolean
  
  # 当代码推送到 workflow-test 分支时触发测试（调试用）
  push:
    branches:
      - workflow-test

# 权限配置：允许 Action 读写仓库内容以进行推送和发布 Release，以及触发其他工作流
permissions:
  contents: write
  actions: write

# 并发控制：避免定时任务与手动触发同时运行，导致并发推送同一分支
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 检出当前分支（main）的代码
      - name: 检出代码仓库
        uses: actions/checkout@v4

      # 配置 Python 环境
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 安装依赖库
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      # 恢复 cache 与已发布的 output
      # cache 取自 snapshot（每日滚动，保存最新增量状态），不存在时回退 data（首次迁移兼容）
      # output 始终取自 data，代表「已发布版本」，作为变更检测与变更报告的基线
      - name: 恢复缓存与已发布数据
        if: github.event.inputs.skip_cache != 'true'
        run: |
          echo "正在检查远程分支..."

          # 1. cache：优先从 snapshot 恢复
          if git fetch origin snapshot >/dev/null 2>&1; then
            echo "从 snapshot 分支恢复缓存..."
            git checkout origin/snapshot -- cache/ 2>/dev/null || true
          elif git fetch origin data >/dev/null 2>&1; then
            echo "snapshot 分支不存在，从 data 分支恢复缓存..."
            git checkout origin/data -- cache/ 2>/dev/null || true
          else
            echo "未发现缓存分支，将建立新缓存目录。"
          fi
          mkdir -p cache

          # 2. output：以 data 分支的已发布版本为准
          if git fetch origin data >/dev/null 2>&1; then
            echo "从 data 分支恢复已发布数据..."
            git checkout origin/data -- output/ 2>/dev/null || true
          else
            echo "data 分支不存在，无已发布数据。"
          fi

      # 备份旧数据用于对比
      # 在运行爬虫前备份旧的output目录，用于生成变更报告
      - name: 备份旧数据用于对比
        run: |
          # 跳过缓存模式下未恢复 output，需从 data 分支获取已发布数据作为对比基线
          if [ ! -d "output" ] && [ "${{ github.event.inputs.skip_cache }}" == "true" ]; then
            echo "跳过缓存模式：从 data 分支获取已发布数据用于对比..."
            if git fetch origin data >/dev/null 2>&1; then
              git checkout origin/data -- output/ 2>/dev/null || true
            fi
          fi

          if [ -d "output" ]; then
            echo "备份旧数据到 prev_output..."
            cp -r output prev_output
          else
            echo "无旧数据，跳过备份"
          fi

      # 获取当前日期与版本号并记录运行前状态
      # 日期与版本号用于 commit 和 Release 标签命名
      # students.json 的 MD5 哈希用于后续对比，判断数据是否更新
      - name: 获取日期并记录运行前状态
        id: meta
        run: |
          echo "当前日期: $(date +'%Y-%m-%d')"
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

          # 读取版本号文件（写入 GITHUB_ENV，供后续 commit / Release 标签使用）
          CODE_VERSION=$(cat crawler/VERSION)
          echo "CODE_VERSION=$CODE_VERSION" >> $GITHUB_ENV
          echo "当前版本: $CODE_VERSION"

          # 记录运行前的状态文件指纹
          if [ -f "output/students.json" ]; then
            md5sum output/students.json | awk '{print $1}' > pre_hash.txt
          else
            echo "empty" > pre_hash.txt
          fi
          echo "运行前 Hash: $(cat pre_hash.txt)"

      # 运行主程序
      - name: 运行爬虫脚本
        run: python -m crawler -m 1 -d 3

      # 检测数据是否发生变化
      # 对比运行前后的 students.json 哈希值
      - name: 检测是否有数据更新
        id: check_changes
        run: |
          # 计算运行后的哈希
          if [ -f "output/students.json" ]; then
            md5sum output/students.json | awk '{print $1}' > post_hash.txt
          else
            echo "empty" > post_hash.txt
          fi

          echo "运行前 Hash: $(cat pre_hash.txt)"
          echo "运行后 Hash: $(cat post_hash.txt)"

          # 比较两个哈希文件，-s 表示静默模式
          if cmp -s pre_hash.txt post_hash.txt; then
            changes_detected=false
            echo "💤 数据文件未发生变化，无需更新。"
          else
            changes_detected=true
            echo "✅ 检测到新数据！准备提交和发布。"
          fi
          echo "changes_detected=$changes_detected" >> $GITHUB_OUTPUT

          # 聚合判断，供后续各步骤的 if 使用（outputs 在步骤结束后才可见，
          # 因此步骤内用 shell 变量传递）：
          # should_publish: data 分支推送 / Release 是否执行（数据变化或手动强制）
          if [ "${{ github.event.inputs.force_data_push }}" == "true" ]; then
            echo "🚀 已启用强制发布（force_data_push）。"
          fi
          if [ "$(cat post_hash.txt)" != "$(cat pre_hash.txt)" ] || [ "${{ github.event.inputs.force_data_push }}" == "true" ]; then
            should_publish=true
          else
            should_publish=false
          fi
          echo "should_publish=$should_publish" >> $GITHUB_OUTPUT

          # should_deploy: 是否触发部署与发布（数据变化、强制推送或手动重新部署）
          if [ "$should_publish" == "true" ] || [ "${{ github.event.inputs.force_deploy }}" == "true" ]; then
            should_deploy=true
          else
            should_deploy=false
          fi
          echo "should_deploy=$should_deploy" >> $GITHUB_OUTPUT
          echo "📋 发布判定汇总: changes_detected=$changes_detected, should_publish=$should_publish, should_deploy=$should_deploy, force_data_push=${{ github.event.inputs.force_data_push }}, force_deploy=${{ github.event.inputs.force_deploy }}"

      # 准备要发布到缓存分支的文件
      - name: 准备发布文件
        run: |
          mkdir -p deployment_folder

          if [ -d "output" ]; then
            cp -r output deployment_folder/
            # 删除 diff_report.md，不提交到 data 分支
            rm -f deployment_folder/output/diff_report.md || true
          fi

          if [ -d "cache" ]; then
            cp -r cache deployment_folder/
          fi

          # 发布 data 分支说明文档与数据许可到分支根目录
          # 源文件维护在 main 分支，data 分支内容整体由本步骤生成
          cp docs/readme-data-branch.md deployment_folder/README.md
          cp LICENSE-DATA deployment_folder/LICENSE-DATA

          echo "以下文件将被推送到 snapshot / data 分支："
          ls -R deployment_folder

      # 将数据和缓存推送到 snapshot 分支
      # 每次运行都推送，滚动保存最新缓存，避免无变化时丢失增量刷新记录
      - name: 将数据和缓存推送到 snapshot 分支
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deployment_folder
          publish_branch: snapshot
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "Cache snapshot: ${{ env.CODE_VERSION }}-${{ steps.meta.outputs.date }}"
          keep_files: false

      # 将数据推送到 data 分支（保持干净的增量变更历史）
      # 仅当检测到变化或手动强制时运行，保证 data 分支前进必有对应的 Release
      - name: 将数据和缓存推送到 data 分支
        if: steps.check_changes.outputs.should_publish == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deployment_folder
          publish_branch: data
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "Auto-update: ${{ env.CODE_VERSION }}-${{ steps.meta.outputs.date }}"
          keep_files: false
          enable_jekyll: true

      # 生成变更报告（仅用于 Release）
      # 在创建 Release 前临时生成，用后自动清理
      - name: 生成变更报告
        if: steps.check_changes.outputs.should_publish == 'true'
        run: python -m crawler.diff_report

      # 生成唯一的 Release 标签名
      # 当天同名 tag 再次创建时追加 -2、-3 后缀，避免互相覆盖
      - name: 生成唯一 Release 标签
        if: steps.check_changes.outputs.should_publish == 'true'
        id: release_tag
        run: |
          base_tag="${{ steps.meta.outputs.date }}-${{ env.CODE_VERSION }}"
          tag="$base_tag"
          num=1
          # 检查同名 tag 是否存在，存在则递增后缀
          while gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; do
            num=$((num+1))
            tag="${base_tag}-${num}"
          done
          echo "唯一标签: $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      # 创建 Release 发布
      # 仅当检测到变化或手动强制时运行
      - name: 创建 Release 版本
        if: steps.check_changes.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.meta.outputs.date }}
          target_commitish: data
          body_path: output/diff_report.md
          files: |
            output/students_data.csv
            output/skipped_ids.csv
            output/students.json
            output/spines.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 触发 部署与发布 工作流
      # 数据更新或手动强制推送时自动触发；也可用 force_deploy 手动重新部署
      - name: 触发部署与发布
        if: steps.check_changes.outputs.should_deploy == 'true'
        run: |
          echo "▶️ 触发 deploy.yml 部署工作流（should_deploy=true）"
          gh workflow run deploy.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}