name: 部署 GitHub Pages

# 触发机制配置
on:
  # 当 main 分支的 web 目录更新时触发
  push:
    branches:
      - main
    paths:
      - 'web/**'

  # 允许手动触发
  workflow_dispatch:

# 权限配置
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # GitHub Pages 部署需要的环境配置
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      # 检出 main 分支代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 设置 Node 环境
      - name: 设置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 从 data 分支获取最新数据
      - name: 获取最新数据
        run: |
          mkdir -p web/public/data
          
          if git fetch origin data 2>/dev/null; then
            git checkout origin/data -- output/ 2>/dev/null || true
            
            if [ -f "output/students_data.csv" ]; then
              cp output/students_data.csv web/public/data/
            fi
            if [ -f "output/schools.json" ]; then
              cp output/schools.json web/public/data/
            fi
          fi

      # 生成元数据文件
      - name: 生成元数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat crawler/VERSION)
          RELEASE_INFO=$(gh api repos/${{ github.repository }}/releases/latest 2>/dev/null || echo "{}")
          
          UPDATE_DATE=$(echo "$RELEASE_INFO" | jq -r '.published_at // empty' | cut -dT -f1)
          RELEASE_URL=$(echo "$RELEASE_INFO" | jq -r '.html_url // empty')
          
          if [ -z "$UPDATE_DATE" ] || [ "$UPDATE_DATE" = "null" ]; then
            UPDATE_DATE=$(date +'%Y-%m-%d')
          fi
          if [ -z "$RELEASE_URL" ] || [ "$RELEASE_URL" = "null" ]; then
            RELEASE_URL="https://github.com/${{ github.repository }}/releases"
          fi
          
          cat > web/public/data/metadata.json << EOF
          {
            "updateDate": "${UPDATE_DATE}",
            "version": "${VERSION}",
            "releaseUrl": "${RELEASE_URL}"
          }
          EOF
          
          echo "生成的元数据:"
          cat web/public/data/metadata.json

      # 安装依赖并构建
      - name: 构建项目
        working-directory: ./web
        run: |
          npm ci
          npm run build

      # 设置 GitHub Pages
      - name: 设置 Pages
        uses: actions/configure-pages@v5

      # 上传页面文件
      - name: 上传页面文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist'

      # 部署到 GitHub Pages
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
