name: 部署 GitHub Pages

# 触发机制配置
on:
  # 当 main 分支的 web 目录更新时触发
  push:
    branches:
      - main
    paths:
      - 'web/**'
  
  # 允许手动触发
  workflow_dispatch:

  # 当 crawler 工作流成功时触发（通过 workflow_run）
  workflow_run:
    workflows: ["日常检测更新"]
    types:
      - completed

# 权限配置
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # 只在 workflow_run 成功时或手动触发时运行
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    
    # GitHub Pages 部署需要的环境配置
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      # 检出 main 分支代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 设置 Node 环境
      - name: 设置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 安装依赖并构建
      - name: 构建项目
        working-directory: ./web
        run: |
          npm ci
          npm run build

      # 设置 GitHub Pages
      - name: 设置 Pages
        uses: actions/configure-pages@v5

      # 上传页面文件
      - name: 上传页面文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist'

      # 部署到 GitHub Pages
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
